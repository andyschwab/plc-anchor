# fly.toml app configuration file generated for plc-anchor on 2026-07-01T08:35:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plc-anchor'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
