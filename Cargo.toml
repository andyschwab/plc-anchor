# Root Cargo workspace for the off-chain Rust components (REFERENCE.md §3).
# A single workspace so ingest (firehose sync indexer) and oracle (DRISL/CID differential
# authority) share one Cargo.lock — pinning atproto-dasl identically across both.
[workspace]
resolver = "2"
members = ["ingest", "oracle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
