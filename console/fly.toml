# Admin console → plc.didmarc.dev
# Deploy from the REPO ROOT (the build context needs witness-ts/ as a sibling):
#   fly launch --no-deploy --config console/fly.toml --dockerfile console/Dockerfile
#   fly --config console/fly.toml volumes create roster_data --region fra --size 1
#   fly --config console/fly.toml secrets set STARKNET_RPC=... ANCHOR_CONTRACT_ADDRESS=... \
#                   STARKNET_ACCOUNT_ADDRESS=... STARKNET_ACCOUNT_PRIVATE_KEY=...
#   # Writes are fail-closed: set an admin secret or the console refuses every change.
#   fly --config console/fly.toml secrets set CONSOLE_ADMIN_TOKEN="$(openssl rand -hex 32)"
#   fly deploy --config console/fly.toml --dockerfile console/Dockerfile
#
#   fly certs add plc.didmarc.dev --config console/fly.toml
#   fly certs add testnet.plc.didmarc.dev --config console/fly.toml
app = "didmarc-console"
primary_region = "fra"

[build]
  dockerfile = 'Dockerfile'

[env]
  # Eurosky-MVP: criterion-driven roster (domain-suffix match), enumerate + tail discovery.
  # These SEED the live settings — once edited in the ⚙ Settings panel, the stored value wins.
  ROSTER_CRITERION = 'pds_domain:eurosky.social'
  PDS_ENDPOINTS = 'https://eurosky.social'
  ACTIVE_DEFAULT = 'false'          # spend gate off at first boot; flip on in the UI
  IMPORT_BUDGET_PER_TICK = '25'
  ENUMERATE_PAGE_SIZE = '50'        # small, frequent trickle: one 50-repo listRepos page per tick…
  ENUMERATE_INTERVAL_MS = '60000'   # …every minute, instead of one big hourly drain
  TAIL_INTERVAL_MS = '60000'
  ENRICH_INTERVAL_MS = '30000'
  PLC_DIRECTORY_URL = 'https://plc.directory'
  PORT = '8787'
  REFRESH_INTERVAL_MS = '300000'
  ROSTER_DB = '/data/roster.db'

[[mounts]]
  source = 'roster_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
