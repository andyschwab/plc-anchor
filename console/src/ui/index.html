<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIDMARC — PLC anchor console</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --line: #272b36; --fg: #e6e8ee; --muted: #9aa3b2;
    --accent: #5b8cff; --ok: #34c759; --warn: #ffb020; --bad: #ff453a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex;
    align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { margin-left: auto; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; display: grid; gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .panel h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 12px; }
  .alarm { border-color: var(--bad); background: #2a1416; }
  .alarm h2 { color: var(--bad); }
  .banner { border: 1px solid var(--bad); background: #2a1416; color: #ffd9d6;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--fg); }
  th .arrow { color: var(--accent); font-size: 10px; }
  td.did, td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .state-candidate { color: var(--muted); }
  .state-approved { color: var(--accent); }
  .state-onboarding { color: var(--warn); }
  .state-anchored { color: var(--fg); }
  .state-removed { color: var(--muted); opacity: .6; }
  .status-confirmed { color: var(--ok); }
  .status-tentative-consistent { color: var(--warn); }
  .status-diverged { color: var(--bad); font-weight: 700; }
  .status-absent { color: var(--muted); }
  button { background: #222634; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07101f; font-weight: 600; }
  input, select, textarea { background: #11141c; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 12px; font-family: inherit; }
  textarea { resize: vertical; min-height: 46px; width: 100%; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .err { color: var(--bad); font-size: 12px; }
  .ok { color: var(--ok); font-size: 12px; }
  .muted { color: var(--muted); }
  /* Active status badge (header) */
  .badge { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; padding: 5px 12px;
    border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .badge .led { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .badge.on { color: var(--ok); border-color: rgba(52,199,89,.5); } .badge.on .led { background: var(--ok); }
  .badge.off { color: var(--muted); }
  /* Stat tiles */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { background: #11141c; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { border-color: var(--accent); }
  .stat.on { border-color: var(--accent); }
  /* Worker status */
  .wstate { display: inline-flex; align-items: center; gap: 7px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .dot.run { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.idle { background: var(--muted); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  td.werr { max-width: 520px; white-space: normal; }
  td.werr .msg { color: var(--bad); font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-word; }
  td.werr .hint { color: var(--warn); font-size: 11px; margin-top: 2px; }
  /* Advanced disclosure */
  details.adv { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  details.adv summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  details.adv summary:hover { color: var(--fg); }
  .triggers { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
  .trigger { background: #11141c; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .trigger .t-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .trigger .desc { color: var(--muted); font-size: 11px; margin-top: 6px; }
  /* Roster */
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  /* Settings panel */
  .setgroup { margin-bottom: 18px; }
  .setgroup h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent);
    margin: 0 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 18px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .field .lbl { color: var(--fg); font-weight: 600; }
  .field .help { color: var(--muted); font-size: 11px; }
  .field input, .field textarea { width: 100%; }
  .field.bool { flex-direction: row; align-items: center; gap: 10px; }
  .switch { position: relative; width: 40px; height: 22px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track { position: absolute; inset: 0; background: #2a2f3c; border: 1px solid var(--line);
    border-radius: 999px; transition: .15s; }
  .switch .track:before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
    background: var(--muted); border-radius: 50%; transition: .15s; }
  .switch input:checked + .track { background: rgba(52,199,89,.25); border-color: var(--ok); }
  .switch input:checked + .track:before { transform: translateX(18px); background: var(--ok); }
  .setenv { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 18px; }
  .setenv .k { color: var(--muted); font-size: 11px; }
  .setenv code { color: var(--fg); font-family: ui-monospace, Menlo, monospace; }
  .saverow { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>DIDMARC · anchor console</h1>
  <span class="meta" id="criterion"></span>
  <span class="spacer"></span>
  <span class="badge off" id="activeBadge" title="on-chain anchoring (the spend gate) — click to edit in Settings">
    <span class="led"></span><span id="activeLabel">—</span>
  </span>
  <button id="settingsBtn" title="edit console settings">⚙ Settings</button>
  <span id="authBox" class="row" hidden>
    <input id="secret" type="password" placeholder="admin secret" style="min-width:140px" />
    <button class="primary" id="unlock">Unlock</button>
    <button id="lock" hidden>Lock</button>
  </span>
  <span class="err" id="authErr"></span>
</header>
<main>
  <section id="topBanner" hidden></section>

  <section class="panel alarm" id="alarmPanel" hidden>
    <h2>Diverged — directory contradicts the proven head</h2>
    <table><tbody id="alarmBody"></tbody></table>
  </section>

  <section class="panel" id="settingsPanel" hidden>
    <h2>Settings <span class="hint" id="settingsNote"></span></h2>
    <div id="settingsBody"></div>
    <div class="setgroup" id="envGroup" style="margin-top:4px"></div>
    <div class="saverow">
      <button class="primary" id="saveSettings">Save changes</button>
      <button id="closeSettings">Close</button>
      <span class="err" id="settingsErr"></span>
      <span class="ok" id="settingsOk"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Spend &amp; roster</h2>
    <div class="stats" id="stats"></div>

    <details class="adv">
      <summary>Advanced — manual worker triggers (the loops run these automatically)</summary>
      <div class="triggers" id="triggers"></div>
    </details>
  </section>

  <section class="panel">
    <h2>Workers <span class="hint">last run of each background loop</span></h2>
    <table>
      <thead><tr><th>Worker</th><th>When</th><th>Result</th><th>Error</th></tr></thead>
      <tbody id="workersBody"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Roster</h2>
    <div class="filters">
      <input id="f-q" placeholder="search DID or handle…" />
      <select id="f-state">
        <option value="">any state</option>
        <option value="candidate">candidate</option>
        <option value="approved">approved</option>
        <option value="onboarding">onboarding</option>
        <option value="anchored">anchored</option>
        <option value="removed">removed</option>
      </select>
      <select id="f-status">
        <option value="">any status</option>
        <option value="confirmed">confirmed</option>
        <option value="tentative-consistent">tentative-consistent</option>
        <option value="diverged">diverged</option>
        <option value="absent">absent</option>
      </select>
      <input id="f-pds" placeholder="PDS host…" />
    </div>
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rosterBody"></tbody>
    </table>
    <div class="pager">
      <button id="prev">‹ Prev</button>
      <span class="meta" id="pageInfo"></span>
      <button id="next">Next ›</button>
    </div>
  </section>
</main>

<script>
const TOKEN_KEY = "didmarc_token";
const token = () => sessionStorage.getItem(TOKEN_KEY);
const api = (path, opts = {}) => {
  const headers = { ...(opts.headers || {}) };
  const t = token();
  if (t) headers["authorization"] = "Bearer " + t;
  return fetch(path, { ...opts, headers }).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); renderAuth("gated"); }
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  });
};
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
const putj = (path, body) => api(path, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cell = (v) => v == null || v === "" ? '<span class="muted">—</span>' : esc(v);
const short = (d) => d && d.length > 24 ? d.slice(0, 16) + "…" + d.slice(-6) : d;
const day = (ms) => ms == null ? null : new Date(ms).toISOString().slice(0, 10);
function ago(ms) {
  if (ms == null) return "never";
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 60) return s + "s ago";
  const m = Math.round(s / 60);
  return m < 60 ? m + "m ago" : Math.round(m / 60) + "h ago";
}
function humanMs(ms) {
  if (!Number.isFinite(ms)) return "";
  if (ms === 0) return "off";
  if (ms < 1000) return ms + "ms";
  const s = ms / 1000; if (s < 60) return (s % 1 ? s.toFixed(1) : s) + "s";
  const m = s / 60; if (m < 60) return (m % 1 ? m.toFixed(1) : m) + "m";
  const h = m / 60; return (h % 1 ? h.toFixed(1) : h) + "h";
}
function fmtStrk(wei) {
  if (wei == null) return null;
  let b; try { b = BigInt(wei); } catch { return null; }
  if (b === 0n) return "0";
  const whole = b / (10n ** 18n);
  const frac = (b % (10n ** 18n)).toString().padStart(18, "0").slice(0, 5).replace(/0+$/, "");
  return whole.toString() + (frac ? "." + frac : "") + " STRK";
}

/** Map a raw worker error to a short, plain-English hint for the operator. */
function errorHint(msg) {
  const m = String(msg);
  if (/ENOTFOUND|EAI_AGAIN|getaddrinfo/i.test(m)) return "DNS: host not found — check the URL and outbound network access.";
  if (/ECONNREFUSED/i.test(m)) return "Connection refused — the service is down or the port is wrong.";
  if (/ETIMEDOUT|CONNECT_TIMEOUT|timed? ?out/i.test(m)) return "Timed out — host slow or unreachable (egress blocked?).";
  if (/UND_ERR_SOCKET|other side closed|socket hang ?up|ECONNRESET|EPIPE/i.test(m)) return "Remote closed the connection mid-request — the PDS or a proxy dropped it (often long pagination or an idle timeout). Usually transient; it resumes from the saved cursor next tick.";
  if (/HTTP 40[13]/.test(m)) return "Rejected by the remote (auth/permission).";
  if (/HTTP 404/.test(m)) return "Endpoint not found — wrong URL or unsupported host.";
  if (/HTTP 429/.test(m)) return "Rate-limited by the remote — raise the delay or lower the batch.";
  if (/HTTP 5\d\d/.test(m)) return "Remote server error — likely transient.";
  if (/certificate|self.signed|TLS|SSL|ERR_TLS/i.test(m)) return "TLS error — certificate or proxy problem.";
  if (/fetch failed/i.test(m)) return "Network request failed — host unreachable or outbound access blocked.";
  return "";
}

// --- auth surface (writes are gated when an admin token is configured) ---
let writeMode = "open";
function renderAuth(mode) {
  if (mode !== undefined) writeMode = mode;
  const gated = writeMode === "gated";
  const closed = writeMode === "closed";
  const unlocked = gated && !!token();
  $("authBox").hidden = !(gated || closed);
  $("secret").hidden = !gated || unlocked;
  $("unlock").hidden = !gated || unlocked;
  $("lock").hidden = !(gated && unlocked);
  $("authErr").textContent = closed ? "writes disabled — set CONSOLE_ADMIN_TOKEN" : "";
}
const canWrite = () => writeMode === "open" || (writeMode === "gated" && !!token());

// --- grid state ---
const COLUMNS = [
  { key: "handle", label: "Handle", sort: "handle" },
  { key: "did", label: "DID", sort: "did", mono: true },
  { key: "state", label: "State", sort: "state" },
  { key: "status", label: "Status", sort: "status" },
  { key: "pdsHost", label: "PDS host", sort: "pdsHost" },
  { key: "keyCount", label: "Keys", sort: "keyCount" },
  { key: "lastOpAt", label: "Last op", sort: "lastOpAt" },
  { key: "anchoredAt", label: "Anchored", sort: "anchoredAt" },
  { key: "anchorFee", label: "Fee", sort: "anchorFee" },
];
const grid = { q: "", state: "", status: "", pdsHost: "", offCriterion: false, sort: "updated_at", order: "desc", limit: 50, offset: 0 };
const WORKER_ORDER = ["enumerate", "tail", "enrich", "onboard", "refresh", "reconcile"];
const TRIGGERS = [
  { name: "enumerate", label: "Enumerate", desc: "Page every configured PDS's listRepos and auto-queue its did:plc repos." },
  { name: "tail", label: "Tail", desc: "Scan /export from ~now, criterion-filtered, for new/changed identities." },
  { name: "enrich", label: "Enrich", desc: "Fetch identity metadata + re-check each DID's PDS against the criterion." },
  { name: "onboard", label: "Onboard", desc: "The spend: anchor approved DIDs on-chain. No-op unless Active." },
  { name: "refresh", label: "Refresh", desc: "Recompute §4 status and the diverged alarm (needs an RPC)." },
  { name: "reconcile", label: "Reconcile", desc: "Re-queue anchored/onboarding DIDs to re-anchor after a contract switch.", confirm: true },
];

function renderHead() {
  $("head").innerHTML = COLUMNS.map((c) => {
    const on = grid.sort === c.sort;
    const arrow = on ? `<span class="arrow">${grid.order === "asc" ? "▲" : "▼"}</span>` : "";
    return `<th class="sortable" data-sort="${c.sort}">${esc(c.label)} ${arrow}</th>`;
  }).join("");
}

function renderRow(e) {
  const c = (k) => {
    if (k === "did") return `<td class="did" title="${esc(e.did)}">${cell(short(e.did))}</td>`;
    if (k === "state") return `<td><span class="pill state-${e.state}">${e.state}</span></td>`;
    if (k === "status") return `<td>${e.status ? `<span class="status-${e.status}">${e.status}</span>` : '<span class="muted">—</span>'}</td>`;
    if (k === "lastOpAt") return `<td>${cell(day(e.lastOpAt))}</td>`;
    if (k === "anchoredAt") return `<td>${cell(day(e.anchoredAt))}</td>`;
    if (k === "anchorFee") return `<td class="mono">${cell(fmtStrk(e.anchorFee))}</td>`;
    if (k === "pdsHost") return `<td>${cell(e.pdsHost)}${e.tombstoned ? ' <span class="pill" style="color:var(--bad)">tomb</span>' : ""}</td>`;
    return `<td>${cell(e[k])}</td>`;
  };
  return `<tr>${COLUMNS.map((col) => c(col.key)).join("")}</tr>`;
}

function query() {
  const p = new URLSearchParams();
  for (const k of ["q", "state", "status", "pdsHost", "sort", "order"]) if (grid[k]) p.set(k, grid[k]);
  if (grid.offCriterion) p.set("offCriterion", "1");
  p.set("limit", grid.limit); p.set("offset", grid.offset);
  return p.toString();
}

async function renderGrid() {
  const { rows, total } = await api("/roster?" + query());
  $("rosterBody").innerHTML =
    rows.map(renderRow).join("") || `<tr><td colspan="${COLUMNS.length}" class="muted">no matching DIDs</td></tr>`;
  const from = total === 0 ? 0 : grid.offset + 1;
  const to = Math.min(grid.offset + grid.limit, total);
  $("pageInfo").textContent = `${from}–${to} of ${total}`;
  $("prev").disabled = grid.offset <= 0;
  $("next").disabled = grid.offset + grid.limit >= total;
}

function showTopBanner(msg) {
  const b = $("topBanner");
  if (!msg) { b.hidden = true; b.innerHTML = ""; return; }
  b.hidden = false; b.className = "banner"; b.innerHTML = `<span>⚠</span><span>${esc(msg)}</span>`;
}

async function renderHeader() {
  const [health, agg] = await Promise.all([api("/healthz"), api("/roster/aggregates")]);
  renderAuth(health.writeMode);
  const active = health.active;
  $("criterion").textContent =
    `${health.criterion || "no criterion"}  ·  anchor ${health.contractAddress.slice(0, 10)}…`;

  const badge = $("activeBadge");
  badge.className = "badge " + (active ? "on" : "off");
  $("activeLabel").textContent = active
    ? `Active${agg.budget != null ? ` · budget ${agg.budget}` : ""}`
    : "Inactive";

  const enr = agg.enrichment || { enriched: 0, pending: 0 };
  const tiles = [
    ["Anchored", agg.anchored],
    ["Pending", agg.backlog],
    ["Diverged", `<span class="${agg.diverged ? "status-diverged" : ""}">${agg.diverged}</span>`],
    ["Enriched", `${enr.enriched}/${enr.enriched + enr.pending}`],
    ["Off-criterion", agg.offCriterion ?? 0, "offcrit"],
    ["Total", agg.total],
    ["Cumulative fee", fmtStrk(agg.feeTotal) ?? "—"],
    ["Avg fee / DID", fmtStrk(agg.feeAverage) ?? "—"],
  ];
  $("stats").innerHTML = tiles.map(([k, v, f]) => {
    const cls = f ? ` clickable${grid.offCriterion && f === "offcrit" ? " on" : ""}` : "";
    return `<div class="stat${cls}"${f ? ` data-statfilter="${f}"` : ""}><div class="k">${k}</div><div class="v">${v}</div></div>`;
  }).join("");

  // Workers — surfaces the periodic runs (and their errors, now including the real cause) in-app.
  $("workersBody").innerHTML = WORKER_ORDER.map((name) => {
    const w = (agg.workers || {})[name];
    if (!w) return `<tr><td><span class="wstate"><span class="dot idle"></span>${name}</span></td><td class="muted">—</td><td class="muted">not run yet</td><td></td></tr>`;
    const dotCls = w.running ? "run" : w.ok === false ? "bad" : w.ok === true ? "ok" : "idle";
    const when = w.running ? "running…" : ago(w.lastRunAt) + (w.durationMs != null ? ` · ${w.durationMs}ms` : "");
    const result = w.summary ? esc(w.summary) : '<span class="muted">—</span>';
    let errCell = "";
    if (w.error) {
      const hint = errorHint(w.error);
      errCell = `<div class="msg" title="${esc(w.error)}">${esc(w.error)}</div>${hint ? `<div class="hint">${esc(hint)}</div>` : ""}`;
    }
    return `<tr><td><span class="wstate"><span class="dot ${dotCls}"></span>${name}</span></td>
      <td class="muted">${when}</td><td>${result}</td><td class="werr">${errCell}</td></tr>`;
  }).join("");

  try {
    const diverged = await api("/roster/diverged");
    const alarm = $("alarmPanel");
    alarm.hidden = diverged.length === 0;
    $("alarmBody").innerHTML = diverged
      .map((e) => `<tr><td class="did">${esc(e.did)}</td><td>${cell(e.handle)}</td><td>${cell(e.statusReason)}</td><td class="mono">${cell(e.headCid)}</td></tr>`)
      .join("");
  } catch { /* diverged is best-effort decoration */ }
}

async function refreshAll() {
  showTopBanner("");
  await Promise.all([renderHeader(), renderGrid()]);
}
async function guard(fn) {
  try { $("authErr").textContent = ""; await fn(); await refreshAll(); }
  catch (e) { $("authErr").textContent = e.message; }
}

// ============================ Settings (one unified panel) ============================
const SETTINGS_SCHEMA = [
  { group: "Spend", fields: [
    { key: "active", type: "bool", label: "Active — on-chain anchoring", help: "The spend gate. When off, onboarding is a no-op regardless of cadence." },
    { key: "importBudget", type: "int", min: 0, label: "Import budget (per onboard tick)", help: "Max on-chain imports each onboard cycle." },
  ]},
  { group: "Discovery", fields: [
    { key: "criterion", type: "text", label: "Criterion", ph: "pds_domain:eurosky.social", help: "Membership rule for the tail. Empty disables the tail." },
    { key: "pdsEndpoints", type: "list", label: "PDS endpoints", ph: "https://eurosky.social", help: "Comma/newline separated. Enumerated via listRepos." },
    { key: "enumeratePageSize", type: "int", min: 1, label: "Enumerate page size (repos / tick)", help: "listRepos page per tick — a small, frequent trickle beats one big drain." },
    { key: "mirrorUrl", type: "text", label: "/export mirror URL", help: "Source for the criterion tail." },
  ]},
  { group: "Identity & enrichment", fields: [
    { key: "directoryUrl", type: "text", label: "PLC directory URL", help: "Resolve + enrichment source (authoritative)." },
    { key: "enrichBatch", type: "int", min: 1, label: "Enrich batch (per tick)", help: "DIDs enriched each cycle." },
    { key: "enrichDelayMs", type: "int", min: 0, label: "Enrich delay (ms / request)", help: "The enrichment rate limit." },
  ]},
  { group: "Cadence", fields: [
    { key: "enumerateIntervalMs", type: "ms", label: "Enumerate interval" },
    { key: "tailIntervalMs", type: "ms", label: "Tail interval" },
    { key: "enrichIntervalMs", type: "ms", label: "Enrich interval" },
    { key: "refreshIntervalMs", type: "ms", label: "Refresh interval" },
  ]},
];
const ENV_LABELS = {
  contractAddress: "Anchor contract", port: "Port", dbPath: "DB path",
  rpcConfigured: "Starknet RPC", ingestConfigured: "Ingest (on-chain writes)",
};
let settingsLoaded = false;

function fieldHtml(f, settings, editable) {
  const dis = editable ? "" : "disabled";
  if (f.type === "bool") {
    const on = !!settings[f.key];
    return `<label class="field bool">
      <span class="switch"><input type="checkbox" id="set-${f.key}" ${on ? "checked" : ""} ${dis}/><span class="track"></span></span>
      <span><span class="lbl">${esc(f.label)}</span>${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</span>
    </label>`;
  }
  const v = f.type === "list" ? (settings[f.key] || []).join(", ") : settings[f.key];
  const val = esc(v == null ? "" : v);
  const help = f.type === "ms"
    ? `<span class="help" id="help-${f.key}">= ${esc(humanMs(Number(settings[f.key])))} · 0 disables</span>`
    : (f.help ? `<span class="help">${esc(f.help)}</span>` : "");
  const input = f.type === "list"
    ? `<textarea id="set-${f.key}" placeholder="${esc(f.ph || "")}" ${dis}>${val}</textarea>`
    : `<input id="set-${f.key}" type="${f.type === "text" ? "text" : "number"}" value="${val}" placeholder="${esc(f.ph || "")}" ${dis}/>`;
  return `<label class="field"><span class="lbl">${esc(f.label)}</span>${input}${help}</label>`;
}

function renderSettings(settings, locked, editable) {
  $("settingsBody").innerHTML = SETTINGS_SCHEMA.map((g) => `
    <div class="setgroup">
      <h3>${esc(g.group)}</h3>
      <div class="setgrid">${g.fields.map((f) => fieldHtml(f, settings, editable)).join("")}</div>
    </div>`).join("");
  $("envGroup").innerHTML = `<h3>Environment — boot-only / secret (set via env, restart to change)</h3>
    <div class="setenv">${Object.entries(locked || {}).map(([k, val]) => {
      const shown = typeof val === "boolean" ? (val ? "configured" : "not set") : String(val);
      return `<div class="k">${esc(ENV_LABELS[k] || k)}: <code>${esc(shown)}</code></div>`;
    }).join("")}</div>`;
  // Live humanize the cadence fields as the operator types.
  for (const f of SETTINGS_SCHEMA.flatMap((g) => g.fields).filter((f) => f.type === "ms")) {
    const el = $("set-" + f.key);
    if (el) el.addEventListener("input", () => { $("help-" + f.key).textContent = `= ${humanMs(Number(el.value))} · 0 disables`; });
  }
  $("saveSettings").disabled = !editable;
  $("settingsNote").textContent = editable ? "changes apply on the next worker tick" : "unlock to edit";
}

async function loadSettings() {
  $("settingsErr").textContent = ""; $("settingsOk").textContent = "";
  const { settings, locked } = await api("/settings");
  renderSettings(settings, locked, canWrite());
  settingsLoaded = true;
}

function collectSettings() {
  const patch = {};
  for (const f of SETTINGS_SCHEMA.flatMap((g) => g.fields)) {
    const el = $("set-" + f.key);
    if (!el) continue;
    if (f.type === "bool") patch[f.key] = el.checked;
    else if (f.type === "list") patch[f.key] = el.value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean);
    else if (f.type === "text") patch[f.key] = el.value.trim();
    else patch[f.key] = Number(el.value);
  }
  return patch;
}

async function openSettings() {
  $("settingsPanel").hidden = false;
  $("settingsPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  try { await loadSettings(); }
  catch (e) { $("settingsBody").innerHTML = `<div class="banner"><span>⚠</span><span>Couldn't load settings: ${esc(e.message)} — <button id="retrySettings">Retry</button></span></div>`;
    const r = $("retrySettings"); if (r) r.onclick = () => openSettings(); }
}

// ============================ wiring ============================
renderHead();
$("head").addEventListener("click", (ev) => {
  const th = ev.target.closest("[data-sort]"); if (!th) return;
  const s = th.dataset.sort;
  if (grid.sort === s) grid.order = grid.order === "asc" ? "desc" : "asc";
  else { grid.sort = s; grid.order = "asc"; }
  grid.offset = 0; renderHead(); renderGrid().catch(() => {});
});

let debounce;
function onFilter() { clearTimeout(debounce); debounce = setTimeout(() => { grid.offset = 0; renderGrid().catch(() => {}); }, 300); }
$("f-q").addEventListener("input", (e) => { grid.q = e.target.value.trim(); onFilter(); });
$("f-pds").addEventListener("input", (e) => { grid.pdsHost = e.target.value.trim(); onFilter(); });
$("f-state").addEventListener("change", (e) => { grid.state = e.target.value; grid.offset = 0; renderGrid().catch(() => {}); });
$("f-status").addEventListener("change", (e) => { grid.status = e.target.value; grid.offset = 0; renderGrid().catch(() => {}); });
$("prev").onclick = () => { grid.offset = Math.max(0, grid.offset - grid.limit); renderGrid().catch(() => {}); };
$("next").onclick = () => { grid.offset += grid.limit; renderGrid().catch(() => {}); };
$("stats").addEventListener("click", (ev) => {
  const tile = ev.target.closest("[data-statfilter='offcrit']");
  if (!tile) return;
  grid.offCriterion = !grid.offCriterion;
  grid.offset = 0;
  refreshAll().catch(() => {});
});

// Advanced — manual worker triggers.
$("triggers").innerHTML = TRIGGERS.map((t) => `
  <div class="trigger">
    <div class="t-top"><strong>${esc(t.label)}</strong><button id="w-${t.name}">Run</button></div>
    <div class="desc">${esc(t.desc)}</div>
  </div>`).join("");
for (const t of TRIGGERS) {
  $("w-" + t.name).onclick = () => {
    if (t.confirm && !confirm("Reconcile: re-queue every anchored/onboarding DID to APPROVED so it re-anchors to the current contract. Use this after switching the anchor contract. Continue?")) return;
    guard(() => post("/worker/" + t.name));
  };
}

// Auth.
$("unlock").onclick = () => guard(async () => {
  const secret = $("secret").value;
  if (!secret) throw new Error("enter the admin secret");
  const r = await post("/auth/login", { secret });
  sessionStorage.setItem(TOKEN_KEY, r.token);
  $("secret").value = "";
  renderAuth();
  if (!$("settingsPanel").hidden) loadSettings().catch(() => {});
});
$("lock").onclick = () => { sessionStorage.removeItem(TOKEN_KEY); renderAuth(); if (!$("settingsPanel").hidden) loadSettings().catch(() => {}); };

// Settings.
$("settingsBtn").onclick = () => { const p = $("settingsPanel"); if (p.hidden) openSettings(); else p.hidden = true; };
$("activeBadge").onclick = () => { if ($("settingsPanel").hidden) openSettings(); else $("settingsPanel").scrollIntoView({ behavior: "smooth" }); };
$("closeSettings").onclick = () => { $("settingsPanel").hidden = true; };
$("saveSettings").onclick = async () => {
  $("settingsErr").textContent = ""; $("settingsOk").textContent = "";
  try {
    await putj("/settings", collectSettings());
    $("settingsOk").textContent = "saved ✓";
    setTimeout(() => { $("settingsOk").textContent = ""; }, 2500);
    await loadSettings();
    await refreshAll();
  } catch (e) { $("settingsErr").textContent = e.message; }
};

// Initial load + periodic refresh. This runs even with the Settings panel open (it only touches
// the header/stats/workers/grid, never the settings form) so the Workers panel keeps updating
// while you toggle Active.
refreshAll().catch((e) => showTopBanner("Console load failed: " + e.message));
setInterval(() => refreshAll().catch(() => {}), 15000);
</script>
</body>
</html>
