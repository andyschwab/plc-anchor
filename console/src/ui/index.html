<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DIDMARC — PLC anchor console</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b24; --line: #272b36; --fg: #e6e8ee; --muted: #9aa3b2;
    --accent: #5b8cff; --ok: #34c759; --warn: #ffb020; --bad: #ff453a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line); display: flex;
    align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; white-space: nowrap; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; display: grid; gap: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; }
  .alarm { border-color: var(--bad); background: #2a1416; }
  .alarm h2 { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--fg); }
  th .arrow { color: var(--accent); font-size: 10px; }
  td.did, td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .state-candidate { color: var(--muted); }
  .state-approved { color: var(--accent); }
  .state-onboarding { color: var(--warn); }
  .state-anchored { color: var(--fg); }
  .state-removed { color: var(--muted); opacity: .6; }
  .status-confirmed { color: var(--ok); }
  .status-tentative-consistent { color: var(--warn); }
  .status-diverged { color: var(--bad); font-weight: 700; }
  .status-absent { color: var(--muted); }
  button { background: #222634; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #07101f; font-weight: 600; }
  input, select { background: #11141c; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .err { color: var(--bad); font-size: 12px; }
  .muted { color: var(--muted); }
  /* Active toggle */
  .toggle { display: inline-flex; align-items: center; gap: 8px; }
  .toggle button { font-weight: 600; padding: 6px 14px; }
  .toggle .on { background: var(--ok); border-color: var(--ok); color: #06210d; }
  .toggle .off { background: #2a2f3c; border-color: var(--line); color: var(--muted); }
  /* Stat tiles */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { background: #11141c; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>DIDMARC · anchor console</h1>
  <span class="meta" id="criterion"></span>
  <span class="toggle" style="margin-left:auto">
    <span class="meta" id="budgetWrap" hidden>budget <input id="budget" type="number" min="0" style="width:64px" /></span>
    <button id="toggle" class="off" title="gates on-chain anchoring (the spend)">○ Inactive</button>
    <span id="authBox" class="row" hidden>
      <input id="secret" type="password" placeholder="admin secret" style="min-width:140px" />
      <button class="primary" id="unlock">Unlock</button>
      <button id="lock" hidden>Lock</button>
    </span>
    <span class="err" id="authErr"></span>
  </span>
</header>
<main>
  <section class="panel alarm" id="alarmPanel" hidden>
    <h2>Diverged — directory contradicts the proven head</h2>
    <table><tbody id="alarmBody"></tbody></table>
  </section>

  <section class="panel">
    <h2>Spend &amp; roster</h2>
    <div class="stats" id="stats"></div>
    <div class="row" style="margin-top:12px; justify-content:flex-end">
      <button id="w-enumerate">Enumerate</button>
      <button id="w-tail">Tail</button>
      <button id="w-enrich">Enrich</button>
      <button id="w-onboard">Onboard</button>
      <button id="w-refresh">Refresh</button>
    </div>
  </section>

  <section class="panel">
    <h2>Roster</h2>
    <div class="filters">
      <input id="f-q" placeholder="search DID or handle…" />
      <select id="f-state">
        <option value="">any state</option>
        <option value="candidate">candidate</option>
        <option value="approved">approved</option>
        <option value="onboarding">onboarding</option>
        <option value="anchored">anchored</option>
        <option value="removed">removed</option>
      </select>
      <select id="f-status">
        <option value="">any status</option>
        <option value="confirmed">confirmed</option>
        <option value="tentative-consistent">tentative-consistent</option>
        <option value="diverged">diverged</option>
        <option value="absent">absent</option>
      </select>
      <input id="f-pds" placeholder="PDS host…" />
    </div>
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rosterBody"></tbody>
    </table>
    <div class="pager">
      <button id="prev">‹ Prev</button>
      <span class="meta" id="pageInfo"></span>
      <button id="next">Next ›</button>
    </div>
  </section>
</main>

<script>
const TOKEN_KEY = "didmarc_token";
const token = () => sessionStorage.getItem(TOKEN_KEY);
const api = (path, opts = {}) => {
  const headers = { ...(opts.headers || {}) };
  const t = token();
  if (t) headers["authorization"] = "Bearer " + t;
  return fetch(path, { ...opts, headers }).then(async (r) => {
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); renderAuth("gated"); }
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    return body;
  });
};
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cell = (v) => v == null || v === "" ? '<span class="muted">—</span>' : esc(v);
const short = (d) => d && d.length > 24 ? d.slice(0, 16) + "…" + d.slice(-6) : d;
const day = (ms) => ms == null ? null : new Date(ms).toISOString().slice(0, 10);
function fmtStrk(wei) {
  if (wei == null) return null;
  let b; try { b = BigInt(wei); } catch { return null; }
  if (b === 0n) return "0";
  const whole = b / (10n ** 18n);
  const frac = (b % (10n ** 18n)).toString().padStart(18, "0").slice(0, 5).replace(/0+$/, "");
  return whole.toString() + (frac ? "." + frac : "") + " STRK";
}

// --- auth surface (writes are gated when an admin token is configured) ---
let writeMode = "open", active = false;
function renderAuth(mode) {
  if (mode !== undefined) writeMode = mode;
  const gated = writeMode === "gated";
  const closed = writeMode === "closed";
  const unlocked = gated && !!token();
  document.getElementById("authBox").hidden = !(gated || closed);
  document.getElementById("secret").hidden = !gated || unlocked;
  document.getElementById("unlock").hidden = !gated || unlocked;
  document.getElementById("lock").hidden = !(gated && unlocked);
  document.getElementById("authErr").textContent = closed ? "writes disabled — set CONSOLE_ADMIN_TOKEN" : "";
}

// --- grid state ---
const COLUMNS = [
  { key: "handle", label: "Handle", sort: "handle" },
  { key: "did", label: "DID", sort: "did", mono: true },
  { key: "state", label: "State", sort: "state" },
  { key: "status", label: "Status", sort: "status" },
  { key: "pdsHost", label: "PDS host", sort: "pdsHost" },
  { key: "keyCount", label: "Keys", sort: "keyCount" },
  { key: "lastOpAt", label: "Last op", sort: "lastOpAt" },
  { key: "anchoredAt", label: "Anchored", sort: "anchoredAt" },
  { key: "anchorFee", label: "Fee", sort: "anchorFee" },
];
const grid = { q: "", state: "", status: "", pdsHost: "", sort: "updated_at", order: "desc", limit: 50, offset: 0 };

function renderHead() {
  document.getElementById("head").innerHTML = COLUMNS.map((c) => {
    const active = grid.sort === c.sort;
    const arrow = active ? `<span class="arrow">${grid.order === "asc" ? "▲" : "▼"}</span>` : "";
    return `<th class="sortable" data-sort="${c.sort}">${esc(c.label)} ${arrow}</th>`;
  }).join("");
}

function renderRow(e) {
  const c = (k) => {
    if (k === "did") return `<td class="did" title="${esc(e.did)}">${cell(short(e.did))}</td>`;
    if (k === "state") return `<td><span class="pill state-${e.state}">${e.state}</span></td>`;
    if (k === "status") return `<td>${e.status ? `<span class="status-${e.status}">${e.status}</span>` : '<span class="muted">—</span>'}</td>`;
    if (k === "lastOpAt") return `<td>${cell(day(e.lastOpAt))}</td>`;
    if (k === "anchoredAt") return `<td>${cell(day(e.anchoredAt))}</td>`;
    if (k === "anchorFee") return `<td class="mono">${cell(fmtStrk(e.anchorFee))}</td>`;
    if (k === "pdsHost") return `<td>${cell(e.pdsHost)}${e.tombstoned ? ' <span class="pill" style="color:var(--bad)">tomb</span>' : ""}</td>`;
    return `<td>${cell(e[k])}</td>`;
  };
  return `<tr>${COLUMNS.map((col) => c(col.key)).join("")}</tr>`;
}

function query() {
  const p = new URLSearchParams();
  for (const k of ["q", "state", "status", "pdsHost", "sort", "order"]) if (grid[k]) p.set(k, grid[k]);
  p.set("limit", grid.limit); p.set("offset", grid.offset);
  return p.toString();
}

async function renderGrid() {
  const { rows, total } = await api("/roster?" + query());
  document.getElementById("rosterBody").innerHTML =
    rows.map(renderRow).join("") || `<tr><td colspan="${COLUMNS.length}" class="muted">no matching DIDs</td></tr>`;
  const from = total === 0 ? 0 : grid.offset + 1;
  const to = Math.min(grid.offset + grid.limit, total);
  document.getElementById("pageInfo").textContent = `${from}–${to} of ${total}`;
  document.getElementById("prev").disabled = grid.offset <= 0;
  document.getElementById("next").disabled = grid.offset + grid.limit >= total;
}

async function renderHeader() {
  const [health, agg] = await Promise.all([api("/healthz"), api("/roster/aggregates")]);
  renderAuth(health.writeMode);
  active = health.active;
  document.getElementById("criterion").textContent =
    `${health.criterion || "no criterion"}  ·  anchor ${health.contractAddress.slice(0, 10)}…`;

  const tgl = document.getElementById("toggle");
  tgl.textContent = active ? "● Active" : "○ Inactive";
  tgl.className = active ? "on" : "off";
  document.getElementById("budgetWrap").hidden = false;
  const budgetEl = document.getElementById("budget");
  if (document.activeElement !== budgetEl) budgetEl.value = agg.budget ?? "";
  budgetEl.placeholder = agg.budget == null ? "25" : "";

  document.getElementById("stats").innerHTML = [
    ["Anchored", agg.anchored],
    ["Pending", agg.backlog],
    ["Diverged", `<span class="${agg.diverged ? "status-diverged" : ""}">${agg.diverged}</span>`],
    ["Total", agg.total],
    ["Cumulative fee", fmtStrk(agg.feeTotal) ?? "—"],
    ["Avg fee / DID", fmtStrk(agg.feeAverage) ?? "—"],
  ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

  const diverged = await api("/roster/diverged");
  const alarm = document.getElementById("alarmPanel");
  alarm.hidden = diverged.length === 0;
  document.getElementById("alarmBody").innerHTML = diverged
    .map((e) => `<tr><td class="did">${esc(e.did)}</td><td>${cell(e.handle)}</td><td>${cell(e.statusReason)}</td><td class="mono">${cell(e.headCid)}</td></tr>`)
    .join("");
}

async function refreshAll() { await Promise.all([renderHeader(), renderGrid()]); }
async function guard(fn) {
  try { document.getElementById("authErr").textContent = ""; await fn(); await refreshAll(); }
  catch (e) { document.getElementById("authErr").textContent = e.message; }
}

// --- wiring ---
renderHead();
document.getElementById("head").addEventListener("click", (ev) => {
  const th = ev.target.closest("[data-sort]"); if (!th) return;
  const s = th.dataset.sort;
  if (grid.sort === s) grid.order = grid.order === "asc" ? "desc" : "asc";
  else { grid.sort = s; grid.order = "asc"; }
  grid.offset = 0; renderHead(); renderGrid().catch(() => {});
});

let debounce;
function onFilter() { clearTimeout(debounce); debounce = setTimeout(() => { grid.offset = 0; renderGrid().catch(() => {}); }, 300); }
document.getElementById("f-q").addEventListener("input", (e) => { grid.q = e.target.value.trim(); onFilter(); });
document.getElementById("f-pds").addEventListener("input", (e) => { grid.pdsHost = e.target.value.trim(); onFilter(); });
document.getElementById("f-state").addEventListener("change", (e) => { grid.state = e.target.value; grid.offset = 0; renderGrid().catch(() => {}); });
document.getElementById("f-status").addEventListener("change", (e) => { grid.status = e.target.value; grid.offset = 0; renderGrid().catch(() => {}); });
document.getElementById("prev").onclick = () => { grid.offset = Math.max(0, grid.offset - grid.limit); renderGrid().catch(() => {}); };
document.getElementById("next").onclick = () => { grid.offset += grid.limit; renderGrid().catch(() => {}); };

document.getElementById("toggle").onclick = () => guard(() => post("/settings/active", { active: !active }));
document.getElementById("budget").onchange = (e) => guard(() => {
  const v = e.target.value.trim();
  return post("/settings/active", { active, budget: v === "" ? null : Number(v) });
});

for (const name of ["enumerate", "tail", "enrich", "onboard", "refresh"]) {
  document.getElementById("w-" + name).onclick = () => guard(() => post("/worker/" + name));
}

document.getElementById("unlock").onclick = () => guard(async () => {
  const secret = document.getElementById("secret").value;
  if (!secret) throw new Error("enter the admin secret");
  const r = await post("/auth/login", { secret });
  sessionStorage.setItem(TOKEN_KEY, r.token);
  document.getElementById("secret").value = "";
  renderAuth();
});
document.getElementById("lock").onclick = () => { sessionStorage.removeItem(TOKEN_KEY); renderAuth(); };

refreshAll().catch((e) => { document.getElementById("criterion").textContent = "error: " + e.message; });
setInterval(() => refreshAll().catch(() => {}), 15000);
</script>
</body>
</html>
