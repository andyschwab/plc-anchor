[package]
name = "ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Firehose sync indexer (REFERENCE.md §3, component 4 / build-order item 4).
# Consumes a PLC directory mirror's `/export` JSONL by `after=<createdAt>` cursor and, for
# anchored DIDs, re-encodes each op to its canonical DRISL signed bytes and submits the delta
# to the anchor endpoint (`import_genesis` / `submit_op`). The normal anchoring path in
# witness mode (§1a Mode 1); where ongoing update cost lives and is allocated.
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# Re-encode directory-served operation JSON to the exact DRISL bytes the contract verifies.
atproto-dasl.workspace = true
# Minimal blocking HTTP client for the live `/export` source (no async runtime).
ureq = "3"
# Live on-chain submission path (the `live` feature). Kept optional so the default build and the
# offline consensus tests stay lean — no async runtime / Starknet client unless `--features live`.
starknet = { version = "0.17.0", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time"], optional = true }
hex = { version = "0.4", optional = true }

[lib]
name = "ingest"
path = "src/lib.rs"

[[bin]]
name = "ingest"
path = "src/main.rs"

# Selector generator for witness-ts: uses the `starknet` crate (live deps), so it must be gated
# or `cargo test --workspace` (no features) would try to compile it and fail.
[[example]]
name = "gen_selectors"
required-features = ["live"]

[features]
# Wire the live Starknet `AnchorSink` (`StarknetSink`) + the `--submit` CLI mode + the on-chain
# E2E test. Off by default: `cargo build`/`cargo test` exercise only the offline pipeline.
live = ["dep:starknet", "dep:tokio", "dep:hex"]
