# sncast config for the live Starknet deploy + E2E paths. Two profiles, NO `default` — the
# network is always explicit (mainnet safety). Scripts key off NETWORK=sepolia|mainnet
# (scripts/lib/starknet-common.sh); these profiles mirror that for manual `sncast` use.
#
# The `anchor` contract has no constructor — authorization is the op's embedded signature, not the
# tx signer (REFERENCE.md §2). It is NOT upgradeable, so each redeploy is a fresh class + new
# address with an EMPTY roster (re-import DIDs). Run `NETWORK=<net> scripts/deploy.sh`.
#
# CURRENT ADDRESSES: see deployments/<network>.json (the machine-readable source of truth).
#   (superseded item-4 Sepolia E2E instance, for the record:
#    contract 0x0202a383c305f9fd8b6c2b2476280379c386b72237deaed7199b85d1cb608f0e)
# WALLETS: scripts/wallet.sh (one funded operator account per network — also the ingest fee-payer).
# Account secrets live OUTSIDE the repo (sncast accounts file, ~/.starknet_accounts/); never commit.
#
# The public dRPC endpoints below serve reads/calls/deploys but RATE-LIMIT the heavy `declare`.
# For declare/redeploy pass a keyed 0.10.x endpoint via STARKNET_RPC (Alchemy/Infura/etc.), which
# the scripts pick up as a `--url` override.

[sncast.sepolia]
url = "https://starknet-sepolia.drpc.org"
account = "plc-sepolia"

[sncast.mainnet]
url = "https://starknet-mainnet.drpc.org"
account = "plc-mainnet"
